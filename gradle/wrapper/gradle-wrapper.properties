# distributionSha256Sum is here for the same reason every action in the workflow is pinned by
# commit rather than by tag: the build downloads somebody else's bytes and runs them with a
# token that can push to this account. The wrapper jar itself is the one at Gradle's own v8.11.1
# tag, sha256 2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
