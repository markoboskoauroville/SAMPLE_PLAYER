# THE VERSION, AND IT IS THE ONLY PLACE IT IS WRITTEN.
#
# MANTRA_MANIFEST/modules/versioning.md: one whole number per app, no dots, and the number lives
# in three places that must all agree. Here it is one place and the other three are DERIVED:
# build.gradle.kts turns it into versionCode and versionName, and the workflow reads this same
# line to build the file name and the release tag. A convention that depends on somebody typing
# it correctly survives until the first tired evening, so nothing here is typed twice.
appVersion=15

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
